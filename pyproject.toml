[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twbr"
version = "0.1.0"
description = "Initial Pinocchio dynamics model for TWBR"
requires-python = ">=3.10"
dependencies = ["pin==4.1.0", "numpy>=2,<3"]

[project.optional-dependencies]
visualization = ["meshcat==0.3.2"]

[tool.setuptools.packages.find]
where = ["src"]
